# Gitleaks — configuration NeoFlow (J02)
# Règles par défaut + règle maison pour les propriétés Spring.
# Tester :  gitleaks git --config .gitleaks.toml --redact -v .
title = "NeoFlow - détection de secrets"

[extend]
useDefault = true

[[rules]]
id = "neoflow-propriete-spring-secret"
description = "Secret en clair dans une propriété Spring (api-key, token, secret, password)"
regex = '''(?i)(?:api[-_.]?key|secret|token|password)\s*[:=]\s*["']?([A-Za-z0-9_\-+/=]{20,})["']?'''
secretGroup = 1
entropy = 3.5
path = '''(?i)(^|/)application(-[a-z0-9]+)?\.(ya?ml|properties)$'''
keywords = ["api-key", "apikey", "api_key", "secret", "token", "password"]
tags = ["neoflow", "spring", "F4"]

[[allowlists]]
description = "Exemples et jeux de test sans valeur réelle"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)src/test/resources/''',
  '''(^|/)docs/''',
]

[[allowlists]]
description = "Placeholders Spring résolus à l'exécution (${VAR} ou ${VAR:defaut})"
regexTarget = "line"
regexes = ['''\$\{[A-Z0-9_]+(:[^}]*)?\}''']

[[allowlists]]
description = "Comptes de démonstration documentés dans le README (mot de passe public « neoflow »)"
targetRules = ["curl-auth-user"]
regexTarget = "match"
regexes = ['''(alice|bob|admin):neoflow''']
