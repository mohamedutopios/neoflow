[project]
name = "neoflow-labs-evals"
version = "2.0.0"
description = "NeoFlow J10 : évaluation de neoagent et des outils IA codés (régression, trajectoires, coûts depuis usage), Langfuse"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# uv run --extra langfuse … : traces des labs et des journaux neoagent dans Langfuse
langfuse = [
  "langfuse>=3.0",                        # testé avec 5.1.0 (OTel) ; scores postés par l'API publique
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
