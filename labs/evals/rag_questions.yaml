    categorie: localisation
    question: "Où est calculé le niveau de validation d'une demande au moment de la soumission ?"
    expected:
      - path: backend/src/main/java/com/neosoft/neoflow/validation/CircuitValidationService.java
        symbol: CircuitValidationService.calculerNiveau
      - path: backend/src/main/java/com/neosoft/neoflow/legacy/RegleValidationLegacy.java
        symbol: RegleValidationLegacy.determinerNiveau
    also_relevant:
      - docs/architecture/ARCHITECTURE.md
      - backend/src/main/java/com/neosoft/neoflow/demande/DemandeService.java
    evidence: ["determinerNiveau"]
    obsolete: [labs/rag/corpus_extra/architecture/DAT_NEOFLOW_v1.4.md]
    answer_keywords: ["CircuitValidationService", "RegleValidationLegacy"]

