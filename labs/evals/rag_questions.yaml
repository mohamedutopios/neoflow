# Jeu de questions de référence du RAG NeoFlow (créé en J05, rejoué en J10).
#
# Format d'une question :
#   id            identifiant stable (ne jamais réutiliser un id supprimé)
#   categorie     type de requête, sert au « meilleur choix par type » du TP
#   question      formulation telle qu'un développeur la poserait
#   expected      fichiers qu'il FAUT lire pour répondre (base du Recall@k) ; symbol facultatif
#   also_relevant fichiers utiles mais non indispensables (comptent pour Hit@k, MRR, Précision@k)
#   evidence      chaînes dont la présence dans un passage du top-k prouve que le contexte suffit
#   obsolete      documents connus pour contredire le code (ne doivent pas passer devant la vérité)
#   answer_keywords  éléments attendus dans une réponse générée (eval.py --faithfulness)
#
# Chemins relatifs à la racine du dépôt. Ajouter en fin de fichier 3 à 5 questions propres à votre
# variante (ids V01, V02...), avec les fichiers attendus vérifiés à la main (rg, git grep, LSP).

version: 1
corpus: neoflow
questions:
