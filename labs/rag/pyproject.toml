[project]
name = "neoflow-rag-lab"
version = "1.0.0"
description = "Lab J05 NeoFlow : RAG local sur code et documentation (Tree-sitter, LlamaIndex, Qdrant, BM25, RRF)"
requires-python = ">=3.11"
dependencies = [
    "llama-index-core>=0.14,<0.15",
    "llama-index-vector-stores-qdrant>=0.10,<0.11",
    "qdrant-client>=1.15",
    "fastembed>=0.7",
    "tree-sitter>=0.25",
    "tree-sitter-java>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-language-pack>=0.9",
    "rank-bm25>=0.2.2",
    "py-rust-stemmers>=0.1",
    "pathspec>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "anthropic>=2.0",      # fournisseur Claude (repondre.py, eval.py --faithfulness --fournisseur anthropic)
    "openai>=1.50",        # client compatible OpenAI : NéoGen, Ollama (base_url)
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false   # lab de scripts, pas de paquet : `uv run python indexer.py`
