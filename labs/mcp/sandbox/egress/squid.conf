# Proxy de sortie de la sandbox J06 : HTTPS (CONNECT) vers une liste blanche, rien d'autre.
http_port 3128

# Seule destination autorisée : l'API du modèle (mode réel de l'agent). En --offline, aucune sortie n'est utile.
acl destinations_autorisees dstdomain api.anthropic.com

acl port_tls port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny CONNECT !port_tls
http_access allow CONNECT destinations_autorisees
http_access deny all

# Aucune mise en cache, pas de fichiers persistants (système de fichiers en lecture seule).
cache deny all
cache_mem 0 MB
pid_filename none
cache_log /dev/stderr
access_log stdio:/dev/stdout squid
via off
forwarded_for delete
