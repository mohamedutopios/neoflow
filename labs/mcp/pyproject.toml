[project]
name = "neoflow-lab-mcp"
version = "0.6.0"
description = "Lab J06 NeoFlow : serveurs MCP maison (retriever RAG, tickets, base en lecture seule) et outillage de test"
requires-python = ">=3.11"
dependencies = [
    # Bornes hautes explicites : une mise à jour majeure d'un SDK MCP se fait par une revue, pas par hasard.
    "fastmcp>=4.1,<4.2",
    "sqlglot>=30,<31",
    "jsonschema>=4.23,<5",      # client : validation des arguments avant envoi au serveur
]

[project.optional-dependencies]
# Serveur Git officiel (tiers) épinglé ET verrouillé avec ses dépendances dans uv.lock :
# lancé par « uv run --no-sync --project labs/mcp mcp-server-git --repository . ».
git = ["mcp-server-git==2026.10.19"]
# Base PostgreSQL de NeoFlow (docker-compose) au lieu de la base SQLite de démonstration.
postgres = ["psycopg[binary]>=3.2,<4"]
# Modes « native » et « bm25 » du lab RAG J05 dans cet environnement (le mode hybride exige
# l'environnement complet de labs/rag : voir README, variante « rag complet »).
rag = ["pyyaml>=6,<7", "pathspec>=0.12,<1", "rank-bm25>=0.2,<0.3", "py-rust-stemmers>=0.1,<0.2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
