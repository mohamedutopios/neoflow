# Configuration commune à tous les profils.
# Profils : dev (PostgreSQL docker, profil par défaut), dev-h2 (H2 en mémoire, sans Docker), test (H2, tests).
spring:
  application:
    name: neoflow-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: Europe/Paris

server:
  port: 8080

neoflow:
  securite:
    utilisateurs:
      - login: alice
        mot-de-passe: "{noop}neoflow"
        roles: [DEMANDEUR]
      - login: bob
        mot-de-passe: "{noop}neoflow"
        roles: [VALIDEUR]
      - login: admin
        mot-de-passe: "{noop}neoflow"
        roles: [ADMIN]
  notification:
    actif: false
    url: https://notifications.neoflow-velmora.example/api/v1/messages
    # Secret injecté à l'exécution (variable d'environnement ou coffre), jamais versionné.
    api-key: ${NEOFLOW_NOTIFICATION_API_KEY:}
    expediteur: neoflow-noreply@velmora.example

management:
  endpoints:
    web:
      exposure:
        # health et info publics (sondes) ; metrics réservé à ADMIN (SecurityConfig). Rien d'autre.
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
  tracing:
    sampling:
      probability: 1.0

logging:
  structured:
    format:
      console: ecs
  level:
    com.neosoft.neoflow: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
